<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Laser-marked metal placeholder</title><desc id="desc">Illustrated brushed metal plate with a precise red laser line; replace with a real project photo.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#272b30"/><stop offset="1" stop-color="#111315"/></linearGradient><linearGradient id="plate"><stop stop-color="#747b82"/><stop offset=".48" stop-color="#c1c6c9"/><stop offset="1" stop-color="#565d64"/></linearGradient><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 1h8M0 5h8" stroke="#fff" stroke-opacity=".1"/></pattern></defs>
  <rect width="900" height="680" fill="url(#bg)"/><circle cx="690" cy="145" r="220" fill="#ff3b3b" opacity=".08"/>
  <g transform="rotate(-8 450 340)"><rect x="114" y="151" width="672" height="378" rx="22" fill="#090a0b" opacity=".5"/><rect x="128" y="132" width="644" height="378" rx="18" fill="url(#plate)" stroke="#d4d7d9" stroke-opacity=".45"/><rect x="128" y="132" width="644" height="378" rx="18" fill="url(#grain)"/><circle cx="164" cy="168" r="6" fill="#292d31"/><circle cx="736" cy="474" r="6" fill="#292d31"/><path d="m274 385 177-188 177 188H511l-60-89-60 89h-117Z" fill="none" stroke="#33383d" stroke-width="9"/><path d="M295 420h312" stroke="#33383d" stroke-width="8" stroke-linecap="round"/><path d="M253 339h390" stroke="#ff3b3b" stroke-width="2" opacity=".9"/></g>
  <text x="450" y="604" text-anchor="middle" fill="#aeb4ba" font-family="system-ui,sans-serif" font-size="17" letter-spacing="4">PHOTO PLACEHOLDER · REPLACE BEFORE LAUNCH</text>
</svg>
